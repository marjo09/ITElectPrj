<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery-container {
            column-count: 3; 
            column-gap: 20px; 
        }

        .gallery-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
            break-inside: avoid; 
        }

        .gallery-item img {
            width: 100%;
            height: auto; /* Keep aspect ratio */
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: white;
            transition: 0.3s ease-in-out;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="homepage.html">
                <img src="Logo.jpg" width="40px" height="40px" alt="Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="homepage.html">Home</a>
                    <a class="nav-link" href="#">Feature</a>
                    <a class="nav-link" href="#">Contact</a>
                    <a class="nav-link active" href="gallary.html" aria-current="page">Gallery</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="container mt-4">
        <div class="gallery-container" id="gallery">
            <div class="gallery-item"><img src="Portrait1.jpg" alt="Portrait 1"></div>
            <div class="gallery-item"><img src="Landscape1.jpg" alt="Landscape 1"></div>
            <div class="gallery-item"><img src="Portrait2.jpg" alt="Portrait 2"></div>
            <div class="gallery-item"><img src="Landscape2.jpeg" alt="Landscape 2"></div>
            <div class="gallery-item"><img src="Portrait3.jpg" alt="Portrait 3"></div>
            <div class="gallery-item"><img src="Landscape3.jpg" alt="Landscape 3"></div>

            <div class="gallery-item hidden"><img src="Portrait4.jpg" alt="Street 1"></div>
            <div class="gallery-item hidden"><img src="Portrait5.jpg" alt="Street 2"></div>
            <div class="gallery-item hidden"><img src="Portrait6.jpg" alt="Street 3"></div>
            <div class="gallery-item hidden"><img src="Portrait7.jpg" alt="Street 1"></div>
            <div class="gallery-item hidden"><img src="Portrait8.jpg" alt="Street 2"></div>
            <div class="gallery-item hidden"><img src="Portrait9.jpg" alt="Street 3"></div>
        </div>

        <div class="text-center mt-4">
            <button id="loadMoreBtn" class="btn btn-outline-secondary">LOAD MORE</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Photography Gallery. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById("loadMoreBtn").addEventListener("click", function() {
            document.querySelectorAll(".hidden").forEach(item => {
                item.style.display = "block"; 
            });
            this.style.display = "none";
        });
    </script>

</body>
</html>
